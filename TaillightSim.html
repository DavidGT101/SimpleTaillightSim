<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rear Light Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="TaillightSim.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="bar-shell"><div class="bar" id="bar"></div></div>
  <div class="dash">
    <div id="ico-left" class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 19l-7-7 7-7v14z"/></svg></div>
    <div id="ico-haz" class="ico hazard" aria-hidden="true"><div class="tri"></div></div>
    <div id="ico-right" class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 5l7 7-7 7V5z"/></svg></div>
  </div>
  <div class="panel" id="panel">
    <div class="mode">Mode: <b id="modeName">Audi</b></div>
    <div class="sound-control">
      <label for="indicatorSound">Indicator sounds:</label>
      <select id="indicatorSound">
        <option value="T1/T2" selected>T1 on / T2 off</option>
        <option value="T1/T1">T1 on / T1 off</option>
        <option value="T2/T2">T2 on / T2 off</option>
        <option value="T2/T1">T2 on / T1 off</option>
      </select>
    </div>
    <div class="touch-controls" id="touchControls">
      <button class="touch-btn" id="btnLock" type="button">Lock/Unlock</button>
      <button class="touch-btn" id="btnLeft" type="button">◀ Left</button>
      <button class="touch-btn" id="btnHazard" type="button">⚠ Hazard</button>
      <button class="touch-btn" id="btnRight" type="button">Right ▶</button>
      <button class="touch-btn" id="btnBrake" type="button">E-Brake</button>
      <button class="touch-btn" id="btnReverse" type="button">Reverse</button>
      <button class="touch-btn" id="btnMode" type="button">Change Mode</button>
    </div>
    <div class="seg-control">
      <label for="segCount">Segments:</label>
      <input type="range" id="segCount" min="20" max="120" step="10" value="60">
      <span class="seg-count-display" id="segCountDisplay">60</span>
    </div>
    <div class="status-row">
      <div class="status-item"><span class="status-dot" id="statusBrake"></span> E-Brake</div>
      <div class="status-item"><span class="status-dot" id="statusReverse"></span> Reverse</div>
    </div>
    <div class="tests" id="tests"><strong>Self-tests</strong><div id="testSummary"></div><ul id="testList"></ul></div>
  </div>
</div>
<script src="TaillightSim.js"></script>
</body>
</html>
